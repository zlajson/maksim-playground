<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILLAGE.IO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }

#hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 12px 20px;
    background: rgba(0,0,0,0.7);
    display: flex;
    gap: 20px;
    align-items: center;
    z-index: 100;
    flex-wrap: wrap;
}
#hud .item {
    color: #eee;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}
#hud .val { font-weight: 700; color: #fff; }

#day-indicator {
    position: fixed;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    z-index: 100;
    transition: all 1s;
    pointer-events: none;
}
#day-indicator.day { background: rgba(255,200,50,0.8); color: #333; }
#day-indicator.night { background: rgba(80,0,0,0.9); color: #ff4444; }
#day-indicator.warning { background: rgba(180,80,0,0.9); color: #fff; animation: pulse 0.5s infinite alternate; }

@keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }

#build-panel {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(0,0,0,0.85);
    border: 2px solid #444;
    border-radius: 12px;
    z-index: 100;
}
.build-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 12px;
    background: #222;
    border: 2px solid #555;
    border-radius: 8px;
    color: #ccc;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 65px;
}
.build-btn:hover { background: #333; border-color: #888; color: #fff; }
.build-btn.active { background: #1a3a1a; border-color: #5a5; color: #5f5; }
.build-btn.disabled { opacity: 0.35; cursor: not-allowed; }
.build-btn .icon { font-size: 20px; }
.build-btn .label { font-size: 9px; font-weight: 600; text-transform: uppercase; }
.build-btn .cost { font-size: 8px; color: #888; }

#notifications {
    position: fixed;
    top: 90px;
    right: 20px;
    z-index: 100;
    pointer-events: none;
}
.notif {
    padding: 8px 14px;
    margin-bottom: 6px;
    background: rgba(0,60,0,0.9);
    border: 1px solid #4a4;
    border-radius: 6px;
    color: #afa;
    font-size: 12px;
    animation: slideIn 0.3s ease, fadeOut 0.5s 2.5s forwards;
}
.notif.warn { background: rgba(80,0,0,0.9); border-color: #a44; color: #faa; }
@keyframes slideIn { from { opacity: 0; transform: translateX(30px); } }
@keyframes fadeOut { to { opacity: 0; } }

#death-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: #ff3333;
    font-size: 48px;
    font-weight: 800;
}
#death-screen p { color: #aaa; font-size: 18px; margin-top: 20px; font-weight: 400; }
#death-screen button {
    margin-top: 30px;
    padding: 12px 30px;
    font-size: 16px;
    background: #333;
    border: 2px solid #666;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
}
#death-screen button:hover { background: #555; }

#instructions {
    position: fixed;
    bottom: 85px;
    left: 20px;
    color: #666;
    font-size: 11px;
    line-height: 1.6;
    z-index: 100;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 50;
}
#crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.5);
}
#crosshair::before { width: 2px; height: 6px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
#crosshair::after { width: 6px; height: 2px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
</style>
</head>
<body>

<div id="hud">
    <div class="item">🪵 Wood: <span class="val" id="h-wood">0</span></div>
    <div class="item">🪵 Planks: <span class="val" id="h-planks">0</span></div>
    <div class="item">🌾 Wheat: <span class="val" id="h-wheat">0</span></div>
    <div class="item">🍞 Bread: <span class="val" id="h-bread">0</span></div>
    <div class="item">🪙 Gold: <span class="val" id="h-gold">0</span></div>
    <div class="item">❤️ HP: <span class="val" id="h-hp">100</span></div>
    <div class="item">👥 Villagers: <span class="val" id="h-villagers">0</span></div>
</div>

<div id="day-indicator" class="day">☀️ DAY</div>
<div id="build-panel"></div>
<div id="notifications"></div>
<div id="crosshair"></div>

<div id="instructions">
    WASD: Move | Mouse: Look<br>
    Click: Chop tree / Place building<br>
    E: Enter/Exit building | ESC: Cancel build<br>
    1-7: Select building | Night = Zombies!
</div>

<div id="death-screen">
    ☠️ YOU DIED
    <p>The zombies got you! Seek shelter at night.</p>
    <button onclick="restartGame()">Try Again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== GAME CONFIG =====
const WORLD_SIZE = 100;
const TILE = 2;
const DAY_LENGTH = 60000; // 60 seconds full cycle
const NIGHT_START = 0.4; // 40% of cycle is day
const NIGHT_END = 0.9;

const BUILDINGS = {
    house: { name: 'House', icon: '🏠', cost: { wood: 8 }, w: 4, h: 4, d: 3.5, color: 0x8B6914, desc: 'Shelter from zombies at night', shelter: true },
    lumberjack: { name: 'Lumberjack', icon: '🪓', cost: { wood: 12 }, w: 3, h: 3, d: 2.5, color: 0x5C3A1E, desc: 'Auto-chops trees nearby', produces: 'wood', rate: 4000, shelter: true },
    sawmill: { name: 'Sawmill', icon: '🏭', cost: { wood: 20 }, w: 4, h: 3, d: 3, color: 0x6B4C2A, desc: 'Converts wood → planks', input: 'wood', output: 'planks', rate: 5000, shelter: true },
    farm: { name: 'Farm', icon: '🌾', cost: { planks: 10 }, w: 5, h: 5, d: 1.5, color: 0x4A7A2A, desc: 'Grows wheat', produces: 'wheat', rate: 6000, shelter: false },
    bakery: { name: 'Bakery', icon: '🍞', cost: { planks: 15, wood: 5 }, w: 4, h: 3, d: 3, color: 0x9A5A2A, desc: 'Wheat → Bread', input: 'wheat', output: 'bread', rate: 5000, shelter: true },
    market: { name: 'Market', icon: '🏪', cost: { planks: 25 }, w: 5, h: 4, d: 3.5, color: 0x4A4A7A, desc: 'Sells goods for gold', special: 'market', rate: 8000, shelter: true },
    wall: { name: 'Wall', icon: '🧱', cost: { planks: 3 }, w: 2, h: 0.5, d: 2.5, color: 0x777777, desc: 'Blocks zombies', shelter: false }
};

// ===== STATE =====
const state = {
    resources: { wood: 10, planks: 0, wheat: 0, bread: 0, gold: 0 },
    buildings: [],
    trees: [],
    zombies: [],
    hp: 100,
    maxHp: 100,
    dayTime: 0,
    isNight: false,
    inShelter: false,
    shelterBuilding: null,
    selectedBuild: null,
    villagers: 2,
    maxVillagers: 4,
    dead: false,
    dayCount: 1,
    zombieWave: 0
};

// ===== THREE.JS SETUP =====
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 60, 150);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(30, 50, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0x4444ff, 0);
moonLight.position.set(-20, 30, -20);
scene.add(moonLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7a3a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Skybox color updates with day/night
const skyColors = { day: 0x87CEEB, sunset: 0xFF6B35, night: 0x0a0a1a };

// ===== PLAYER CONTROLLER =====
const player = {
    velocity: new THREE.Vector3(),
    direction: new THREE.Vector3(),
    speed: 8,
    euler: new THREE.Euler(0, 0, 0, 'YXZ'),
    locked: false
};

// Pointer lock
renderer.domElement.addEventListener('click', () => {
    if (!state.dead && !player.locked) {
        renderer.domElement.requestPointerLock();
    }
});

document.addEventListener('pointerlockchange', () => {
    player.locked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', (e) => {
    if (!player.locked) return;
    player.euler.y -= e.movementX * 0.002;
    player.euler.x -= e.movementY * 0.002;
    player.euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.euler.x));
    camera.quaternion.setFromEuler(player.euler);
});

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    // Number keys for build selection
    const num = parseInt(e.key);
    if (num >= 1 && num <= 7) {
        const types = Object.keys(BUILDINGS);
        if (num <= types.length) selectBuild(types[num - 1]);
    }
    if (e.code === 'Escape') { state.selectedBuild = null; updateBuildPanel(); }
    if (e.code === 'KeyE') toggleShelter();
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Click to chop/place
document.addEventListener('mousedown', (e) => {
    if (!player.locked || e.button !== 0) return;
    if (state.selectedBuild) {
        placeBuildingAtLook();
    } else {
        chopTreeAtLook();
    }
});

// ===== TREE GENERATION =====
function createTree(x, z) {
    const group = new THREE.Group();
    
    // Trunk
    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 2, 6);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a2a0a });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1;
    trunk.castShadow = true;
    group.add(trunk);

    // Foliage
    const type = Math.random() < 0.4 ? 'pine' : 'oak';
    if (type === 'pine') {
        const coneGeo = new THREE.ConeGeometry(1, 3, 6);
        const coneMat = new THREE.MeshLambertMaterial({ color: 0x1a6a2a });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.y = 3.2;
        cone.castShadow = true;
        group.add(cone);
    } else {
        const sphereGeo = new THREE.SphereGeometry(1.2, 8, 6);
        const sphereMat = new THREE.MeshLambertMaterial({ color: 0x2a8a2a });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.y = 3;
        sphere.castShadow = true;
        group.add(sphere);
    }

    group.position.set(x, 0, z);
    scene.add(group);

    return { mesh: group, x, z, health: 3, alive: true, type, regrow: 0 };
}

function generateTrees() {
    for (let i = 0; i < 150; i++) {
        const x = (Math.random() - 0.5) * WORLD_SIZE * 1.6;
        const z = (Math.random() - 0.5) * WORLD_SIZE * 1.6;
        if (Math.hypot(x, z) < 8) continue; // Keep center clear
        state.trees.push(createTree(x, z));
    }
}

// ===== BUILDING SYSTEM =====
function createBuildingMesh(type, x, z) {
    const def = BUILDINGS[type];
    const group = new THREE.Group();

    // Main body
    const bodyGeo = new THREE.BoxGeometry(def.w, def.d, def.h);
    const bodyMat = new THREE.MeshLambertMaterial({ color: def.color });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = def.d / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    // Roof (for shelter buildings)
    if (def.shelter && type !== 'wall') {
        const roofGeo = new THREE.ConeGeometry(Math.max(def.w, def.h) * 0.75, 1.5, 4);
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x8B0000 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = def.d + 0.75;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
    }

    // Door indicator
    if (def.shelter) {
        const doorGeo = new THREE.BoxGeometry(0.8, 1.5, 0.1);
        const doorMat = new THREE.MeshLambertMaterial({ color: 0x3a2a0a });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(0, 0.75, def.h / 2 + 0.05);
        group.add(door);
    }

    // Type-specific details
    if (type === 'farm') {
        // Wheat rows
        for (let i = -1.5; i <= 1.5; i += 0.8) {
            const rowGeo = new THREE.BoxGeometry(def.w - 1, 0.6, 0.3);
            const rowMat = new THREE.MeshLambertMaterial({ color: 0xDAA520 });
            const row = new THREE.Mesh(rowGeo, rowMat);
            row.position.set(0, 0.3, i);
            group.add(row);
        }
    }

    if (type === 'wall') {
        // Wall is just the body, make it look like stone
        body.material.color.setHex(0x888888);
    }

    group.position.set(x, 0, z);
    scene.add(group);
    return group;
}

function placeBuildingAtLook() {
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObject(ground);
    if (hits.length === 0) return;

    const point = hits[0].point;
    const type = state.selectedBuild;
    const def = BUILDINGS[type];

    // Snap to grid
    const gx = Math.round(point.x / TILE) * TILE;
    const gz = Math.round(point.z / TILE) * TILE;

    // Check distance from player
    if (Math.hypot(gx - camera.position.x, gz - camera.position.z) > 15) {
        notify('Too far away!', true);
        return;
    }

    // Check resources
    for (const [res, amt] of Object.entries(def.cost)) {
        if ((state.resources[res] || 0) < amt) {
            notify('Not enough resources!', true);
            return;
        }
    }

    // Check overlap with existing buildings
    for (const b of state.buildings) {
        const bd = BUILDINGS[b.type];
        // Walls can be placed side by side (no gap buffer)
        const buffer = (type === 'wall' && b.type === 'wall') ? 0 : 0.5;
        if (Math.abs(gx - b.x) < (def.w + bd.w) / 2 + buffer &&
            Math.abs(gz - b.z) < (def.h + bd.h) / 2 + buffer) {
            notify('Too close to another building!', true);
            return;
        }
    }

    // Deduct resources
    for (const [res, amt] of Object.entries(def.cost)) {
        state.resources[res] -= amt;
    }

    // Clear trees in the area
    for (const tree of state.trees) {
        if (tree.alive && Math.abs(tree.x - gx) < def.w / 2 + 1 && Math.abs(tree.z - gz) < def.h / 2 + 1) {
            tree.alive = false;
            tree.mesh.visible = false;
            tree.regrow = 30000;
            state.resources.wood += 1;
        }
    }

    // Create building
    const mesh = createBuildingMesh(type, gx, gz);
    state.buildings.push({
        type, x: gx, z: gz, mesh,
        lastProduced: Date.now(),
        level: 1
    });

    if (type === 'house') {
        state.maxVillagers += 2;
    }

    notify(`${def.name} built!`);
    state.selectedBuild = null;
    updateBuildPanel();
}

// ===== TREE CHOPPING =====
function chopTreeAtLook() {
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

    for (const tree of state.trees) {
        if (!tree.alive) continue;
        const dist = camera.position.distanceTo(tree.mesh.position);
        if (dist > 6) continue;

        // Simple distance + direction check
        const toTree = new THREE.Vector3().subVectors(tree.mesh.position, camera.position).normalize();
        const lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        if (toTree.dot(lookDir) > 0.85) {
            tree.health--;
            // Shake effect
            tree.mesh.rotation.z = (Math.random() - 0.5) * 0.2;
            setTimeout(() => { if (tree.mesh) tree.mesh.rotation.z = 0; }, 200);

            if (tree.health <= 0) {
                tree.alive = false;
                tree.mesh.visible = false;
                tree.regrow = 25000;
                state.resources.wood += 3;
                notify('+3 Wood!');
            }
            return;
        }
    }
}

// ===== SHELTER SYSTEM =====
function toggleShelter() {
    if (state.inShelter) {
        // Exit
        state.inShelter = false;
        state.shelterBuilding = null;
        notify('Left shelter');
        return;
    }

    // Find nearby shelter building
    for (const b of state.buildings) {
        const def = BUILDINGS[b.type];
        if (!def.shelter) continue;
        const dist = Math.hypot(camera.position.x - b.x, camera.position.z - b.z);
        if (dist < def.w) {
            state.inShelter = true;
            state.shelterBuilding = b;
            notify('Entered shelter! Safe from zombies.');
            return;
        }
    }
    notify('No shelter nearby! Get close to a building and press E.', true);
}

// ===== ZOMBIE SYSTEM =====
function createZombie(x, z) {
    const group = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.6, 1.4, 0.4);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2a5a2a });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.4;
    body.castShadow = true;
    group.add(body);

    // Head
    const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const headMat = new THREE.MeshLambertMaterial({ color: 0x3a6a3a });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.35;
    head.castShadow = true;
    group.add(head);

    // Eyes (red glow)
    const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.12, 2.4, 0.25);
    group.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.12, 2.4, 0.25);
    group.add(eyeR);

    // Arms
    const armGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
    const armMat = new THREE.MeshLambertMaterial({ color: 0x2a5a2a });
    const armL = new THREE.Mesh(armGeo, armMat);
    armL.position.set(-0.5, 1.5, 0.3);
    armL.rotation.x = -0.5;
    group.add(armL);
    const armR = new THREE.Mesh(armGeo, armMat);
    armR.position.set(0.5, 1.5, 0.3);
    armR.rotation.x = -0.5;
    group.add(armR);

    group.position.set(x, 0, z);
    scene.add(group);

    return { mesh: group, x, z, speed: 2 + Math.random() * 1.5, hp: 2 };
}

function spawnZombieWave() {
    const count = 3 + state.zombieWave * 2;
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 20;
        const x = camera.position.x + Math.cos(angle) * dist;
        const z = camera.position.z + Math.sin(angle) * dist;
        state.zombies.push(createZombie(x, z));
    }
    state.zombieWave++;
    notify(`Zombie wave ${state.zombieWave}! Find shelter!`, true);
}

function updateZombies(dt) {
    const playerPos = new THREE.Vector3(camera.position.x, 0, camera.position.z);

    for (let i = state.zombies.length - 1; i >= 0; i--) {
        const z = state.zombies[i];
        const zPos = new THREE.Vector3(z.x, 0, z.z);

        // Move toward player
        const dir = new THREE.Vector3().subVectors(playerPos, zPos).normalize();
        
        // Check wall collisions
        let blocked = false;
        for (const b of state.buildings) {
            const def = BUILDINGS[b.type];
            if (Math.abs(z.x + dir.x * z.speed * dt - b.x) < def.w / 2 + 0.3 &&
                Math.abs(z.z + dir.z * z.speed * dt - b.z) < def.h / 2 + 0.3) {
                blocked = true;
                // Damage building visual (shake)
                if (b.mesh && Math.random() < 0.01) {
                    b.mesh.rotation.y = (Math.random() - 0.5) * 0.02;
                }
                break;
            }
        }

        if (!blocked) {
            z.x += dir.x * z.speed * dt;
            z.z += dir.z * z.speed * dt;
            z.mesh.position.set(z.x, 0, z.z);
            z.mesh.lookAt(playerPos.x, 0, playerPos.z);
        }

        // Zombie bob animation
        z.mesh.position.y = Math.sin(Date.now() * 0.005 + i) * 0.1;

        // Check if hitting player
        const distToPlayer = playerPos.distanceTo(zPos);
        if (distToPlayer < 1.5 && !state.inShelter) {
            state.hp -= 15 * dt;
            if (state.hp <= 0) {
                state.dead = true;
                document.getElementById('death-screen').style.display = 'flex';
                document.exitPointerLock();
            }
        }
    }
}

function clearZombies() {
    for (const z of state.zombies) {
        scene.remove(z.mesh);
    }
    state.zombies = [];
}

// ===== DAY/NIGHT CYCLE =====
function updateDayNight(dt) {
    state.dayTime = (state.dayTime + dt / DAY_LENGTH) % 1;
    const t = state.dayTime;

    const wasNight = state.isNight;
    state.isNight = t > NIGHT_START && t < NIGHT_END;

    // Transition to night
    if (state.isNight && !wasNight) {
        spawnZombieWave();
        document.getElementById('day-indicator').className = 'night';
        document.getElementById('day-indicator').textContent = '🌙 NIGHT - ZOMBIES!';
    }

    // Transition to day
    if (!state.isNight && wasNight) {
        clearZombies();
        state.dayCount++;
        document.getElementById('day-indicator').className = 'day';
        document.getElementById('day-indicator').textContent = `☀️ DAY ${state.dayCount}`;
        state.hp = Math.min(state.maxHp, state.hp + 20);
        notify('Sunrise! Zombies gone. +20 HP recovered.');
    }

    // Warning before night
    if (t > NIGHT_START - 0.05 && t < NIGHT_START) {
        document.getElementById('day-indicator').className = 'warning';
        document.getElementById('day-indicator').textContent = '⚠️ NIGHT APPROACHING!';
    }

    // Lighting
    let sunIntensity, moonIntensity, ambientIntensity, skyColor, fogColor;
    if (!state.isNight) {
        const dayProgress = t / NIGHT_START;
        sunIntensity = 1.0;
        moonIntensity = 0;
        ambientIntensity = 0.5;
        skyColor = 0x87CEEB;
        fogColor = 0x87CEEB;
        // Sunset warning
        if (t > NIGHT_START - 0.1) {
            const sunset = (t - (NIGHT_START - 0.1)) / 0.1;
            skyColor = lerpColor(0x87CEEB, 0xFF6B35, sunset);
            fogColor = skyColor;
            sunIntensity = 1.0 - sunset * 0.5;
        }
    } else {
        sunIntensity = 0;
        moonIntensity = 0.3;
        ambientIntensity = 0.1;
        skyColor = 0x0a0a1a;
        fogColor = 0x0a0a1a;
    }

    sunLight.intensity = sunIntensity;
    moonLight.intensity = moonIntensity;
    ambientLight.intensity = ambientIntensity;
    scene.background = new THREE.Color(skyColor);
    scene.fog.color = new THREE.Color(fogColor);
    scene.fog.near = state.isNight ? 15 : 60;
    scene.fog.far = state.isNight ? 40 : 150;
}

function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return (r << 16) | (g << 8) | bl;
}

// ===== PRODUCTION =====
function updateProduction() {
    const now = Date.now();
    for (const b of state.buildings) {
        const def = BUILDINGS[b.type];
        if (!def.rate || now - b.lastProduced < def.rate) continue;

        if (def.produces) {
            if (def.produces === 'wood') {
                const nearTree = state.trees.find(t => t.alive && Math.hypot(t.x - b.x, t.z - b.z) < 12);
                if (nearTree) {
                    nearTree.health--;
                    if (nearTree.health <= 0) {
                        nearTree.alive = false;
                        nearTree.mesh.visible = false;
                        nearTree.regrow = 25000;
                    }
                    state.resources.wood += 2;
                    b.lastProduced = now;
                }
            } else {
                state.resources[def.produces] += 1;
                b.lastProduced = now;
            }
        } else if (def.input && def.output) {
            if ((state.resources[def.input] || 0) >= 2) {
                state.resources[def.input] -= 2;
                state.resources[def.output] += 1;
                b.lastProduced = now;
            }
        } else if (def.special === 'market') {
            // Auto-sell best goods
            if (state.resources.bread > 0) {
                state.resources.bread--;
                state.resources.gold += 5;
                notify('+5 Gold (sold bread)');
                b.lastProduced = now;
            } else if (state.resources.wheat > 2) {
                state.resources.wheat -= 2;
                state.resources.gold += 2;
                notify('+2 Gold (sold wheat)');
                b.lastProduced = now;
            } else if (state.resources.planks > 3) {
                state.resources.planks -= 3;
                state.resources.gold += 2;
                notify('+2 Gold (sold planks)');
                b.lastProduced = now;
            }
        }
    }
}

// ===== TREE REGROWTH =====
function updateTrees(dt) {
    for (const tree of state.trees) {
        if (!tree.alive) {
            tree.regrow -= dt * 1000;
            if (tree.regrow <= 0) {
                tree.alive = true;
                tree.health = 3;
                tree.mesh.visible = true;
            }
        }
    }
}

// ===== PLAYER MOVEMENT =====
function updatePlayer(dt) {
    if (state.dead || state.inShelter) return;

    const moveSpeed = player.speed * dt;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();

    let moved = false;
    const move = new THREE.Vector3();
    if (keys['KeyW']) { move.add(forward); moved = true; }
    if (keys['KeyS']) { move.sub(forward); moved = true; }
    if (keys['KeyD']) { move.add(right); moved = true; }
    if (keys['KeyA']) { move.sub(right); moved = true; }

    if (moved) {
        move.normalize().multiplyScalar(moveSpeed);
        
        // Collision with buildings
        const newX = camera.position.x + move.x;
        const newZ = camera.position.z + move.z;
        let canMoveX = true, canMoveZ = true;

        for (const b of state.buildings) {
            const def = BUILDINGS[b.type];
            const hw = def.w / 2 + 0.5;
            const hh = def.h / 2 + 0.5;
            if (Math.abs(newX - b.x) < hw && Math.abs(camera.position.z - b.z) < hh) canMoveX = false;
            if (Math.abs(camera.position.x - b.x) < hw && Math.abs(newZ - b.z) < hh) canMoveZ = false;
        }

        if (canMoveX) camera.position.x = newX;
        if (canMoveZ) camera.position.z = newZ;

        // World bounds
        camera.position.x = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, camera.position.x));
        camera.position.z = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, camera.position.z));
    }

    camera.position.y = 2; // Fixed height
}

// ===== BUILD PANEL =====
function selectBuild(type) {
    const def = BUILDINGS[type];
    let canAfford = true;
    for (const [r, a] of Object.entries(def.cost)) {
        if ((state.resources[r] || 0) < a) canAfford = false;
    }
    if (!canAfford) {
        notify('Not enough resources!', true);
        return;
    }
    state.selectedBuild = state.selectedBuild === type ? null : type;
    updateBuildPanel();
}

function updateBuildPanel() {
    const panel = document.getElementById('build-panel');
    panel.innerHTML = '';
    let i = 1;
    for (const [key, def] of Object.entries(BUILDINGS)) {
        const btn = document.createElement('div');
        btn.className = 'build-btn';

        let canAfford = true;
        const costStr = Object.entries(def.cost).map(([r, a]) => {
            if ((state.resources[r] || 0) < a) canAfford = false;
            return `${a}${r.charAt(0).toUpperCase()}`;
        }).join(' ');

        if (!canAfford) btn.classList.add('disabled');
        if (state.selectedBuild === key) btn.classList.add('active');

        btn.innerHTML = `<span class="icon">${def.icon}</span><span class="label">${i}. ${def.name}</span><span class="cost">${costStr}</span>`;
        btn.onclick = () => selectBuild(key);
        panel.appendChild(btn);
        i++;
    }
}

// ===== PLACEMENT PREVIEW =====
let previewMesh = null;
function updatePlacementPreview() {
    if (!state.selectedBuild) {
        if (previewMesh) { scene.remove(previewMesh); previewMesh = null; }
        return;
    }

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObject(ground);
    if (hits.length === 0) return;

    const def = BUILDINGS[state.selectedBuild];
    const point = hits[0].point;
    const gx = Math.round(point.x / TILE) * TILE;
    const gz = Math.round(point.z / TILE) * TILE;

    if (!previewMesh) {
        const geo = new THREE.BoxGeometry(def.w, def.d, def.h);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3, wireframe: true });
        previewMesh = new THREE.Mesh(geo, mat);
        scene.add(previewMesh);
    }

    // Update size if needed
    previewMesh.scale.set(1, 1, 1);
    previewMesh.geometry.dispose();
    previewMesh.geometry = new THREE.BoxGeometry(def.w, def.d, def.h);
    previewMesh.position.set(gx, def.d / 2, gz);

    // Color based on validity
    const dist = Math.hypot(gx - camera.position.x, gz - camera.position.z);
    const valid = dist <= 15;
    previewMesh.material.color.setHex(valid ? 0x00ff00 : 0xff0000);
}

// ===== UI =====
function updateHUD() {
    document.getElementById('h-wood').textContent = state.resources.wood;
    document.getElementById('h-planks').textContent = state.resources.planks;
    document.getElementById('h-wheat').textContent = state.resources.wheat;
    document.getElementById('h-bread').textContent = state.resources.bread;
    document.getElementById('h-gold').textContent = state.resources.gold;
    document.getElementById('h-hp').textContent = Math.ceil(state.hp);
    document.getElementById('h-villagers').textContent = `${state.villagers}/${state.maxVillagers}`;
}

function notify(text, warn = false) {
    const el = document.createElement('div');
    el.className = 'notif' + (warn ? ' warn' : '');
    el.textContent = text;
    document.getElementById('notifications').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

// ===== RESTART =====
function restartGame() {
    // Clear everything
    for (const t of state.trees) scene.remove(t.mesh);
    for (const b of state.buildings) scene.remove(b.mesh);
    clearZombies();
    if (previewMesh) { scene.remove(previewMesh); previewMesh = null; }

    state.trees = [];
    state.buildings = [];
    state.resources = { wood: 10, planks: 0, wheat: 0, bread: 0, gold: 0 };
    state.hp = 100;
    state.dayTime = 0;
    state.isNight = false;
    state.inShelter = false;
    state.dead = false;
    state.dayCount = 1;
    state.zombieWave = 0;
    state.selectedBuild = null;
    state.villagers = 2;
    state.maxVillagers = 4;

    camera.position.set(0, 2, 0);
    player.euler.set(0, 0, 0);
    camera.quaternion.setFromEuler(player.euler);

    generateTrees();
    updateBuildPanel();
    document.getElementById('death-screen').style.display = 'none';
    document.getElementById('day-indicator').className = 'day';
    document.getElementById('day-indicator').textContent = '☀️ DAY 1';
}
window.restartGame = restartGame;

// ===== GAME LOOP =====
let lastTime = performance.now();
let panelTimer = 0;

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (!state.dead) {
        updatePlayer(dt);
        updateDayNight(dt);
        updateProduction();
        updateTrees(dt);
        if (state.isNight) updateZombies(dt);
        updatePlacementPreview();
        updateHUD();

        panelTimer += dt;
        if (panelTimer > 1) {
            updateBuildPanel();
            panelTimer = 0;
        }
    }

    renderer.render(scene, camera);
}

// ===== INIT =====
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

generateTrees();
updateBuildPanel();
scene.background = new THREE.Color(0x87CEEB);
notify('Welcome to VILLAGE.IO! Chop trees, build shelter before night!');
notify('Click to lock mouse. WASD to move.', true);
animate();
</script>
